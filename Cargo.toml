[package]
name = "claude-messages-bridge"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Anthropic Messages API backed by Claude Code's stdio RPC"
license = "MIT"

[dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
redb = "2.6.3"
url = "2"
tower-http = { version = "0.6", features = ["fs"] }
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
lto = "thin"
strip = true
